name: Build and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build-packages:
    name: Build packages
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Test libraries
        run: dotnet test tests/SmodbusTcp.Tests/SmodbusTcp.Tests.csproj --configuration Release

      - name: Run AOT smoke test
        run: dotnet run --project tests/SmodbusTcp.AotSmoke/SmodbusTcp.AotSmoke.csproj --configuration Release

      - name: Pack libraries
        run: |
          $suffix = "ci.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          $projects = @(
            'src/SmodbusTcp/SmodbusTcp.csproj',
            'src/SmodbusTcp.Kestrel/SmodbusTcp.Kestrel.csproj'
          )
          foreach ($project in $projects) {
            if ($env:GITHUB_REF -like 'refs/tags/v*') {
              $version = $env:GITHUB_REF_NAME.Substring(1)
              dotnet pack $project --configuration Release --output artifacts/packages --version $version
            } else {
              dotnet pack $project --configuration Release --output artifacts/packages --version-suffix $suffix
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  portable-samples:
    name: Build portable samples
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Publish framework-dependent samples
        run: |
          $published = 0
          foreach ($sample in Get-ChildItem samples -Directory) {
            foreach ($kind in @('client', 'server')) {
              $project = Join-Path $sample.FullName "$kind/$kind.csproj"
              if (-not (Test-Path $project -PathType Leaf)) { continue }
              dotnet publish $project --configuration Release --no-self-contained -p:UseAppHost=false --output "artifacts/samples/$($sample.Name)/$kind"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $published++
            }
          }
          if ($published -eq 0) { throw 'No sample client or server projects found.' }

      - name: Archive portable samples
        run: |
          Push-Location artifacts/samples
          try {
            zip -qr ../../samples-portable.zip .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Upload portable samples
        uses: actions/upload-artifact@v7
        with:
          path: samples-portable.zip
          if-no-files-found: error
          archive: false

  publish-packages:
    name: Publish prereleases to GitHub Packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Publish packages to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/$env:GITHUB_REPOSITORY_OWNER/index.json" --name github --username $env:GITHUB_REPOSITORY_OWNER --password $env:GITHUB_TOKEN --store-password-in-clear-text
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem artifacts/packages -Filter '*.nupkg' -File -Recurse)
          if ($packages.Count -eq 0) { throw 'No NuGet packages found in artifacts/packages' }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source github --api-key $env:GITHUB_TOKEN --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  native-aot:
    name: Build native samples (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish native sample servers
        run: |
          $published = 0
          foreach ($sample in Get-ChildItem samples -Directory) {
            $project = Join-Path $sample.FullName 'server/server.csproj'
            if (-not (Test-Path $project -PathType Leaf)) { continue }
            dotnet publish $project --configuration Release --runtime "${{ matrix.rid }}" -p:PublishAot=true --output "artifacts/aot/$($sample.Name)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $published++
          }
          if ($published -eq 0) { throw 'No sample server projects found.' }

      - name: Archive native sample servers (tar.gz)
        if: runner.os != 'Windows'
        run: tar -czf "samples-aot-${{ matrix.rid }}.tar.gz" -C artifacts/aot .

      - name: Archive native sample servers (zip)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "artifacts/aot/*" -DestinationPath "samples-aot-${{ matrix.rid }}.zip"

      - name: Upload native sample servers
        uses: actions/upload-artifact@v7
        with:
          path: samples-aot-${{ matrix.rid }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error
          archive: false

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-packages, portable-samples, native-aot]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/nuget-packages

      - name: Download portable samples
        uses: actions/download-artifact@v8
        with:
          name: samples-portable.zip
          path: dist
          skip-decompress: true

      - name: Download Linux native samples
        uses: actions/download-artifact@v8
        with:
          name: samples-aot-linux-x64.tar.gz
          path: dist
          skip-decompress: true

      - name: Download Windows native samples
        uses: actions/download-artifact@v8
        with:
          name: samples-aot-win-x64.zip
          path: dist
          skip-decompress: true

      - name: Package release assets
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $packages = @(Get-ChildItem artifacts/nuget-packages -Filter '*.nupkg' -File)
          if ($packages.Count -eq 0) { throw 'No NuGet packages found in artifacts/nuget-packages' }
          $packages | Copy-Item -Destination dist
          Move-Item dist/samples-aot-linux-x64.tar.gz "dist/samples-aot-linux-x64-$env:GITHUB_REF_NAME.tar.gz"
          Move-Item dist/samples-aot-win-x64.zip "dist/samples-aot-win-x64-$env:GITHUB_REF_NAME.zip"
          Move-Item dist/samples-portable.zip "dist/samples-portable-$env:GITHUB_REF_NAME.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY @assets --generate-notes

  publish-nuget:
    name: Publish packages to NuGet.org
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Get temporary NuGet API key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem artifacts/packages -Filter '*.nupkg' -File -Recurse)
          if ($packages.Count -eq 0) { throw 'No NuGet packages found in artifacts/packages' }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
